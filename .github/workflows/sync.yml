name: Daily upstream sync

on:
  schedule:
    # 09:17 Asia/Shanghai = 01:17 UTC
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync with upstream Fabric
        id: sync
        run: |
          python3 scripts/sync_upstream.py | tee sync_output.txt
          if grep -q "^PENDING_TRANSLATION_OR_REVIEW:" sync_output.txt; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            grep "^PENDING_TRANSLATION_OR_REVIEW:" sync_output.txt | cut -d: -f2- > pending.txt
          fi
          if grep -q "^SYNCED" sync_output.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit sync results
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: upstream Fabric $(date +%F)"
          git push

      - name: Open issue for pending translations
        if: steps.sync.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PENDING=$(cat pending.txt)
          gh issue create \
            --title "待翻译/复核的 Pattern：$(date +%F)" \
            --body "本次上游同步发现以下 Pattern 新增或内容变更，已在 data/patterns.json 中标记 pending_translation / needs_review，欢迎认领翻译：

          $PENDING

          详见 sync_reports/ 下当日报告。" \
            --label "translation" || true
